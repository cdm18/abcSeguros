<h2>Detalles de Seguro de Viaje</h2>
<p>Informacion especifica del seguro</p>

<form (ngSubmit)="siguientePaso()">
  <input type="date" [(ngModel)]="viajeForm().fechaInicio" name="fechaInicio">
  <input type="date" [(ngModel)]="viajeForm().fechaFin" name="fechaFin">
  <input [(ngModel)]="viajeForm().destino" name="destino" placeholder="Destino">
  <input [(ngModel)]="viajeForm().paisResidencia" name="paisResidencia" placeholder="País de residencia">
  <input [(ngModel)]="viajeForm().motivoViaje" name="motivoViaje" placeholder="Motivo de viaje">
  <input [(ngModel)]="viajeForm().cobertura" name="cobertura" placeholder="Tipo de cobertura deseada">

  <button type="submit">Siguiente</button>
</form>
