<div class="step-container">
  <h2 class="text-center text-2xl font-bold text-blue-600 mb-4">Compara Opciones</h2>
  <p class="text-center mb-6">Selecciona la opción que mejor se adapte a tus necesidades</p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 justify-items-center">

    <button
      *ngFor="let plan of planOptions"
      type="button"
      class="border rounded-xl p-4 shadow-md w-full max-w-xs
             cursor-pointer transition-transform hover:scale-105
             focus:outline-none focus:ring-2 focus:ring-blue-500"
      [ngClass]="{ 'border-blue-500 ring-2 ring-blue-400' : selectedOption?.id === plan.id }"
      (click)="seleccionarOpcion(plan)">

      <h3 class="text-lg font-bold text-center mb-1">{{ plan.name }}</h3>
      <p class="text-sm text-center mb-2">{{ plan.description }}</p>

      <div class="text-center text-xl font-bold text-blue-600">
        {{ plan.price_monthly | number:'1.2-2' }} <span class="text-sm font-normal">/ mes</span>
      </div>
      <div class="text-center text-sm text-gray-600 mb-4">
        {{ plan.price_yearly | number:'1.2-2' }} anual
      </div>

      <div class="mb-2">
        <strong>🛡️ Coberturas:</strong>
        <ul class="list-disc list-inside text-sm text-green-700">
          <li *ngFor="let c of plan.coverage">{{ c }}</li>
        </ul>
      </div>

      <div>
        <strong>🎁 Beneficios:</strong>
        <ul class="list-disc list-inside text-sm text-yellow-700">
          <li *ngFor="let b of plan.benefits">{{ b }}</li>
        </ul>
      </div>
    </button>

  </div>

  <div class="flex justify-between mt-8">
    <button class="bg-gray-500 text-white px-4 py-2 rounded" (click)="retroceder()">← Anterior</button>
    <button
      class="bg-blue-600 text-white px-4 py-2 rounded"
      [disabled]="!selectedOption"
      [class.opacity-50]="!selectedOption"
      (click)="continuar()">Siguiente →</button>
  </div>
</div>
