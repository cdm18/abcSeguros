<div class="container mt-5">
  <h2 class="mb-4">Selecciona un Plan de Seguro</h2>

  <form (ngSubmit)="continuar()" #formTipo="ngForm">
    <div class="form-group mb-3">
      <label>Opciones disponibles:</label>

      <div class="form-check" *ngFor="let plan of plans">
        <input class="form-check-input"
               type="radio"
               name="plan"
               [value]="plan.id"
               [(ngModel)]="selectedPlanId"
               required
               [id]="'plan-' + plan.id"
               (change)="selectedPlanId = +selectedPlanId" />
        <label class="form-check-label" [for]="'plan-' + plan.id">
          {{ plan.name }} - ${{ plan.price_monthly }}
        </label>
      </div>
    </div>

    <div class="d-flex justify-content-between mt-4">
      <button type="button" class="btn btn-secondary" (click)="retroceder()">Anterior</button>
      <button type="submit" class="btn btn-primary" [disabled]="!formTipo.valid">Siguiente</button>
    </div>
  </form>
</div>
