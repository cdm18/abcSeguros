<!-- =======================================================================
     dashboard.component.html
     ======================================================================= -->
<section *ngIf="loading()" class="loading-state">
  <div class="spinner-border text-primary" role="status"></div>
  <span class="ms-2">Cargando datos…</span>
</section>

<section *ngIf="!loading()" class="dashboard">

  <!-- ========= ENCABEZADO ========= -->
  <header class="dash-header d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4" aos>
    <h2 class="m-0 fw-bold">
      ¡Hola {{ auth.currentUser?.full_name || auth.currentUser?.username }}!
    </h2>
  </header>

  <!-- ========= QUICK ACTIONS ========= -->
  <section class="quick-actions row g-3 mb-4" aos>
    <ng-container *ngFor="let action of [
         {icon:'bi-plus-circle',   text:'Nueva Cotización', link:'/cotizaciones/nueva',   disabled:false},
         {icon:'bi-graph-up',      text:'Generar Reporte',  link:'#',                    disabled:true },
         {icon:'bi-bell',          text:'Recordatorios',    link:'#',                    disabled:true }
       ]">
      <div class="col-12 col-md-4">
        <button class="quick-card w-100" [routerLink]="action.link" [disabled]="action.disabled">
          <i class="bi" [ngClass]="action.icon"></i>
          <span>{{ action.text }}</span>
        </button>
      </div>
    </ng-container>
  </section>

  <!-- ========= SUMMARY CARDS ========= -->
  <section class="summary row g-3 mb-5" aos>
    <ng-container *ngFor="let card of [
        {icon:'bi-people-fill',   label:'TOTAL CLIENTES',     value: totalClients},
        {icon:'bi-file-earmark',  label:'TOTAL COTIZACIONES', value: totalQuotations},
        {icon:'bi-clock-history', label:'PAGOS A TIEMPO',     value: onTimePayments},
        {icon:'bi-hourglass',     label:'PAGOS PENDIENTES',   value: pendingPayments}
      ]">
      <div class="col-6 col-lg-3">
        <div class="summary-card position-relative" aos>
          <i class="bi {{ card.icon }} card-bg-icon"></i>
          <small>{{ card.label }}</small>
          <h3>{{ card.value }}</h3>
        </div>
      </div>
    </ng-container>
  </section>

  <!-- ========= CHARTS ========= -->
  <section class="charts d-grid gap-4 mb-5"
           [class.charts-double]="true" aos>
    <!-- Doughnut -->
    <div class="chart-wrapper">
      <canvas baseChart
              [data]="doughnutCfg().data"
              [type]="doughnutCfg().type"
              [options]="doughnutCfg().options">
      </canvas>
    </div>

    <!-- Trend line -->
    <div class="chart-wrapper">
      <canvas baseChart
              [data]="trendCfg().data"
              [type]="trendCfg().type"
              [options]="trendCfg().options">
      </canvas>
    </div>
  </section>

  <!-- ========= CLIENTES RECIENTES ========= -->
  <section class="last-clients" aos>
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h4 class="m-0">Clientes recientes</h4>
      <a routerLink="/clientes" class="btn btn-link p-0 fw-semibold">Ver todos</a>
    </div>

    <ul class="list-unstyled m-0 row g-3">
      <li *ngFor="let c of lastClients" class="col-12 col-md-6 col-lg-4">
        <div class="client-card d-flex align-items-center gap-3 h-100">

          <!-- icono redondo -->
          <div class="client-icon"><i class="fa-solid fa-user"></i></div>

          <!-- datos -->
          <div class="flex-grow-1">
            <strong>{{ c.first_name }} {{ c.last_name }}</strong><br>
            <small class="text-muted d-block">{{ c.email }}</small>
            <small class="text-muted">ID #{{ c.id }}</small>
          </div>

          <!-- chevron -->
          <span class="chevron"><i class="bi bi-chevron-right"></i></span>
        </div>
      </li>
    </ul>
  </section>

</section>
