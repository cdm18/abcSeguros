<div class="container mt-4">
  <h2 class="mb-4">Datos Personales</h2>

  <form (ngSubmit)="continuar()" #formDatos="ngForm">
    <div class="mb-3">
      <label for="nombres">Nombres: *</label>
      <input type="text" id="nombres" name="nombres" class="form-control" [(ngModel)]="datosCliente.nombres" required>
    </div>

    <div class="mb-3">
      <label for="apellidos">Apellidos: *</label>
      <input type="text" id="apellidos" name="apellidos" class="form-control" [(ngModel)]="datosCliente.apellidos" required>
    </div>

    <div class="mb-3">
      <label for="correo">Correo: *</label>
      <input type="email" id="correo" name="correo" class="form-control" [(ngModel)]="datosCliente.correo" required>
    </div>

    <div class="mb-3">
      <label for="telefono">Teléfono: *</label>
      <input type="text" id="telefono" name="telefono" class="form-control" [(ngModel)]="datosCliente.telefono" required>
    </div>

    <div class="mb-3">
      <label for="fechaNacimiento">Fecha de Nacimiento:</label>
      <input type="date" id="fechaNacimiento" name="fechaNacimiento" class="form-control" [(ngModel)]="datosCliente.fechaNacimiento">
    </div>

    <div class="mb-3">
      <label for="ciudad">Ciudad:</label>
      <input type="text" id="ciudad" name="ciudad" class="form-control" [(ngModel)]="datosCliente.ciudad">
    </div>

    <div class="mb-3">
      <label for="ocupacion">Ocupación:</label>
      <input type="text" id="ocupacion" name="ocupacion" class="form-control" [(ngModel)]="datosCliente.ocupacion">
    </div>

    <div class="mb-3">
      <label for="ingresos">Ingresos:</label>
      <input type="number" id="ingresos" name="ingresos" class="form-control" [(ngModel)]="datosCliente.ingresos">
    </div>

    <div class="mb-3">
      <label for="direccion">Dirección:</label>
      <input type="text" id="direccion" name="direccion" class="form-control" [(ngModel)]="datosCliente.direccion">
    </div>

    <button type="submit" class="btn btn-primary" [disabled]="!formDatos.valid">Guardar y continuar</button>
  </form>
</div>
