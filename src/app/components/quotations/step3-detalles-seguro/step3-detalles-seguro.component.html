<!-- src/app/components/quotations/step3-detalles-seguro/step3-detalles-seguro.component.html -->
<div>
  <!-- Aviso si no se reconoce -->
  <div *ngIf="planCode() === 'DESCONOCIDO'; else selectorReal"
       class="alert alert-warning d-flex justify-content-between align-items-center">
    <span>Por favor, elige un plan válido.</span>
    <button class="btn btn-sm btn-secondary" (click)="emitirPrev()">Volver</button>
  </div>

  <ng-template #selectorReal>
    <ng-container [ngSwitch]="planCode()">

      <app-step3-auto  *ngSwitchCase="'AUTO'"
                       (prev)="emitirPrev()"
                       (continuar)="emitirNext()">
      </app-step3-auto>

      <app-step3-hogar *ngSwitchCase="'HOGAR'"
                       (prev)="emitirPrev()"
                       (continuar)="emitirNext()">
      </app-step3-hogar>

      <app-step3-viaje *ngSwitchCase="'VIAJE'"
                       (prev)="emitirPrev()"
                       (continuar)="emitirNext()">
      </app-step3-viaje>

      <app-step3-vida  *ngSwitchCase="'VIDA'"
                       (prev)="emitirPrev()"
                       (continuar)="emitirNext()">
      </app-step3-vida>

      <div *ngSwitchDefault class="alert alert-warning">
        El tipo de seguro seleccionado aún no está soportado.
      </div>
    </ng-container>
  </ng-template>
</div>
