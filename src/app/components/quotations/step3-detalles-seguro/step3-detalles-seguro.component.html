<!-- step3-detalles-seguro.component.html -->
<div class="container mt-4">
  <h2 class="mb-3">Detalles del Seguro Seleccionado</h2>

  <!-- Mostrar componente según tipo de seguro -->
  <ng-container [ngSwitch]="tipoSeguro">

    <app-step3-auto
      *ngSwitchCase="2"
      (continuar)="next.emit($event)"
      (prev)="prev.emit()">
    </app-step3-auto>

    <app-step3-hogar
      *ngSwitchCase="4"
      (continuar)="next.emit($event)"
      (prev)="prev.emit()">
    </app-step3-hogar>

    <app-step3-viaje
      *ngSwitchCase="1"
      (continuar)="next.emit($event)"
      (prev)="prev.emit()">
    </app-step3-viaje>

    <app-step3-vida
      *ngSwitchCase="3"
      (continuar)="next.emit($event)"
      (prev)="prev.emit()">
    </app-step3-vida>

    <p *ngSwitchDefault class="text-danger">
      ⚠️ Por favor seleccione un tipo de seguro válido.
    </p>

  </ng-container>
</div>
