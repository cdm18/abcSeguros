<div class="container mt-4" data-aos="fade-up">
  <h2 class="mb-3">Clientes Registrados</h2>

  <div *ngIf="cargando" class="alert alert-info">Cargando datos...</div>

  <div *ngIf="!cargando && clientes.length === 0" class="alert alert-warning">
    No hay clientes registrados.
  </div>

  <table *ngIf="clientes.length > 0" class="table table-striped">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Teléfono</th>
        <th>Dirección</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of clientes">
        <td>{{ c.id }}</td>
        <td>{{ c.first_name }} {{ c.last_name }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone || '-' }}</td>
        <td>{{ c.address || '-' }}</td>
      </tr>
    </tbody>
  </table>
</div>
