<div class="container p-4" style="max-width: 400px; margin: auto;">
  <h2 class="text-center mb-4">Iniciar Sesión</h2>

  <form (ngSubmit)="login()">
    <div class="mb-3">
      <label for="username" class="form-label">Usuario</label>
      <input [(ngModel)]="username" name="username" type="text" class="form-control" id="username" required />
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Contraseña</label>
      <input [(ngModel)]="password" name="password" type="password" class="form-control" id="password" required />
    </div>

    <div *ngIf="errorMsg" class="alert alert-danger">{{ errorMsg }}</div>

    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
  </form>
</div>
