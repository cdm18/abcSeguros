<div class="d-flex">
  <app-sidebar class="d-none d-lg-block"></app-sidebar>

  <div class="flex-grow-1 p-4">
    <h2 class="fw-semibold mb-4" data-aos="fade-down">Panel General</h2>

    <!-- Tarjetas resumen -->
    <div class="row g-3 mb-5" *ngIf="summary as s">
      <div class="col-sm-6 col-lg-3" data-aos="zoom-in" data-aos-delay="100">
        <div class="card h-100 border-0 shadow rounded-4 text-center py-4">
          <i class="bi bi-people fs-2 text-primary"></i>
          <h6 class="mt-2">Clientes</h6>
          <h3 class="fw-bold">{{s.totalClients}}</h3>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3" data-aos="zoom-in" data-aos-delay="200">
        <div class="card h-100 border-0 shadow rounded-4 text-center py-4">
          <i class="bi bi-shield-check fs-2 text-success"></i>
          <h6 class="mt-2">Pólizas</h6>
          <h3 class="fw-bold">{{s.totalPolicies}}</h3>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3" data-aos="zoom-in" data-aos-delay="300">
        <div class="card h-100 border-0 shadow rounded-4 text-center py-4">
          <i class="bi bi-wallet2 fs-2 text-info"></i>
          <h6 class="mt-2">Pagos a Tiempo</h6>
          <h3 class="fw-bold">{{s.onTimePayments}}</h3>
        </div>
      </div>
      <div class="col-sm-6 col-lg-3" data-aos="zoom-in" data-aos-delay="400">
        <div class="card h-100 border-0 shadow rounded-4 text-center py-4">
          <i class="bi bi-clock-history fs-2 text-warning"></i>
          <h6 class="mt-2">Pagos Pendientes</h6>
          <h3 class="fw-bold">{{s.pendingPayments}}</h3>
        </div>
      </div>
    </div>

    <!-- Tabla de clientes -->
    <div class="card border-0 shadow rounded-4" data-aos="fade-up">
      <div class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Clientes recientes</h5>
        <button class="btn btn-sm btn-primary disabled"><i class="bi bi-plus-lg"></i> Nuevo</button>
      </div>

      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light">
          <tr><th>#</th><th>Nombre</th><th>Plan</th><th>Total</th><th>Estado</th></tr>
          </thead>
          <tbody>
          <tr *ngFor="let c of clients; index as i">
            <td>{{i+1}}</td>
            <td>
              <div class="fw-semibold">{{c.name}}</div>
              <small class="text-muted">{{c.email}}</small>
            </td>
            <td>{{c.plan}}</td>
            <td class="fw-bold">${{c.total}}</td>
            <td>
                <span class="badge"
                      [ngClass]="{'bg-success-subtle text-success':c.status==='ACTIVE',
                              'bg-warning-subtle text-warning':c.status==='PENDING'}">
                  {{c.status}}
                </span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <div *ngIf="loading" class="text-center p-4">
        <div class="spinner-border text-primary"></div>
      </div>
    </div>
  </div>
</div>
