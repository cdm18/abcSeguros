<div class="d-flex">
  <app-sidebar class="d-none d-lg-block"></app-sidebar>

  <main class="flex-grow-1 p-4 bg-light min-vh-100">
    <!-- Header -->
    <header class="d-flex flex-wrap align-items-center justify-content-between mb-4 gap-3">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-outline-secondary d-lg-none" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#sidebarOffcanvas">
          <i class="bi bi-list"></i>
        </button>
        <h1 class="h2 fw-bold mb-0 text-dark">
          Hola, {{ user?.full_name || user?.username || 'Usuario' }}
        </h1>
      </div>

      <div class="d-flex align-items-center gap-3">
        <!-- Search -->
        <div class="position-relative">
          <div class="input-group search-box">
            <span class="input-group-text bg-white border-end-0">
              <i class="bi bi-search text-muted"></i>
            </span>
            <input type="search"
                   class="form-control border-start-0 ps-0"
                   placeholder="Buscar clientes, pólizas…"
                   [formControl]="term"
                   style="border-radius: 0 20px 20px 0;">
          </div>

          <!-- Dropdown resultados -->
          <div class="dropdown-menu show position-absolute w-100 shadow-lg border-0 mt-1"
               *ngIf="showDropdown"
               style="border-radius: 12px; max-height: 200px; overflow-y: auto;">
            <div class="dropdown-item d-flex align-items-center"
                 *ngFor="let r of results"
                 (click)="select(r)"
                 style="cursor: pointer;">
              <i class="bi me-2"
                 [class.bi-person-circle]="r.type === 'client'"
                 [class.bi-shield-check]="r.type === 'policy'"></i>
              <div>
                <div class="fw-medium">{{ r.label }}</div>
                <small class="text-muted">{{ r.type === 'client' ? 'Cliente' : 'Póliza' }}</small>
              </div>
            </div>
            <div class="dropdown-item text-center text-muted" *ngIf="results.length === 0">
              <small>No se encontraron resultados</small>
            </div>
          </div>
        </div>

        <!-- Notifications -->
        <div class="position-relative">
          <button class="btn btn-outline-light border-0 position-relative">
            <i class="bi bi-bell text-muted fs-5"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  style="font-size: 0.6rem;">
              {{ summary?.pendingPayments || 0 }}
            </span>
          </button>
        </div>

        <!-- User Avatar -->
        <div class="dropdown">
          <!-- avatar -->
          <a [routerLink]="['/profile']">
            <img [src]="avatar()" width="40" height="40" class="rounded-circle" alt="avatar">
          </a>



          <ul class="dropdown-menu dropdown-menu-end shadow border-0"
              style="border-radius: 12px;">
            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Perfil</a></li>
            <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Configuración</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</a></li>
          </ul>
        </div>
      </div>
    </header>

    <!-- Dashboard Content -->
    <div class="container-fluid px-0">
      <app-dashboard-cards
        [summary]="summary"
        [clients]="clients"
        [loading]="loading"
        (newClient)="goNewClient()"
        (generateReport)="goReport()"
        (reminders)="goReminders()">
      </app-dashboard-cards>
    </div>
  </main>
</div>

<!-- Sidebar Offcanvas para móviles -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarOffcanvas">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Menú</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-0">
    <app-sidebar></app-sidebar>
  </div>
</div>
